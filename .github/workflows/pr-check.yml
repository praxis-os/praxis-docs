name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site (catches broken links)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Validate RAG frontmatter
        run: npm run validate:rag
